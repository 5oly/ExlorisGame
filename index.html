<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Exloris</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingContainer = document.querySelector("#unity-loading-container");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ExlorisGame.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/ExlorisGame.data.unityweb",
        frameworkUrl: buildUrl + "/ExlorisGame.framework.js.unityweb",
        codeUrl: buildUrl + "/ExlorisGame.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "Exloris",
        productName: "Exloris",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // Fixed 16:9 presentation: the canvas is the largest 1920x1080-shaped
      // rectangle that fits the page, centered, with black bars filling the rest.
      // The render target is sized to the displayed pixels but never above
      // 1920x1080, so larger screens upscale instead of rendering more pixels.
      config.matchWebGLToCanvasSize = false;

      var designWidth = 1920;
      var designHeight = 1080;
      var fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      function fitCanvasToAspect() {
        var areaWidth = fullscreenContainer.clientWidth || window.innerWidth;
        var areaHeight = fullscreenContainer.clientHeight || window.innerHeight;
        var scale = Math.min(areaWidth / designWidth, areaHeight / designHeight);
        var cssWidth = Math.floor(designWidth * scale);
        var cssHeight = Math.floor(designHeight * scale);

        canvas.style.width = cssWidth + "px";
        canvas.style.height = cssHeight + "px";
        canvas.style.left = Math.floor((areaWidth - cssWidth) / 2) + "px";
        canvas.style.top = Math.floor((areaHeight - cssHeight) / 2) + "px";

        var dpr = window.devicePixelRatio || 1;
        var renderWidth = Math.min(designWidth, Math.round(cssWidth * dpr));
        var renderHeight = Math.min(designHeight, Math.round(cssHeight * dpr));
        if (canvas.width !== renderWidth || canvas.height !== renderHeight) {
          canvas.width = renderWidth;
          canvas.height = renderHeight;
        }
      }

      fitCanvasToAspect();
      window.addEventListener("resize", fitCanvasToAspect);
      window.addEventListener("orientationchange", fitCanvasToAspect);
      document.addEventListener("fullscreenchange", function () { setTimeout(fitCanvasToAspect, 50); });
      document.addEventListener("webkitfullscreenchange", function () { setTimeout(fitCanvasToAspect, 50); });

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }



      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
